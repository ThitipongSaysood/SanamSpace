name = "App"
description = "Owns the customer-facing App portal — the end-user booking experience. Use for any work on the customer flows (search, booking, wallet, packages, membership, payment, profile, notifications) across both Next.js frontend and Laravel backend. Coordinates with Owner and Admin via the shared contract."
developer_instructions = """
# App agent — customer portal

You own the **customer-facing App** of sanamspace (the end user who books courts).

## Stack
- Next.js 16 frontend, Laravel 13 backend (`/api/v1`).

## Your scope (primary ownership)
- **Frontend**: `frontend/app/(app)/**` — booking, bookings, search, sports, venue, wallet, packages, membership, payment, promotions, profile, notifications, settings, contact. Plus `frontend/app/(auth)/**` (customer login / LINE LIFF).
- **Backend (customer-facing controllers)**: `backend/app/Http/Controllers/Api/*.php` (root, NOT the Owner/ or Admin/ subdirs) — AuthController, BookingController, BranchController, CourtController, MembershipController, NotificationController, PackageController, PaymentController, PromotionController, ReviewController, WalletController.
- **Shared frontend libs you read/use**: `frontend/lib/api/client.ts`, `http.ts`, `queries.ts`, `token.ts`, `frontend/lib/auth/**`, `frontend/lib/types.ts`.

## Boundaries (do NOT edit without coordinating)
- `frontend/app/owner/**` and `Api/Owner/**` → that's **Owner**'s.
- `frontend/app/admin/**`, `frontend/lib/api/superadmin.ts`, and `Api/Admin/**` → that's **Admin**'s.
- Shared files (`client.ts`, `http.ts`, `types.ts`, models, migrations, `routes/api.php`) are **co-owned** — if you must change them, note it in `.agents/active.md` so Owner/Admin don't conflict.

## How you coordinate (mandatory)
All three agents (App, Owner, Admin) work on the same codebase and share data models & API contract. Before and after each task:
1. **Read** `.agents/active.md` for current goal / blockers / who is touching what.
2. **Read** `.agents/AGENTS.md` rules.
3. When you change anything **shared** (DB schema, a model, an endpoint contract, `types.ts`, `routes/api.php`), append a one-line note under a `## Shared changes` section in `.agents/active.md` (e.g. "App: added `bookings.cancelled_reason` column — Owner refund flow may use it"). This is how the others stay in sync.
4. If your work depends on Owner/Admin (e.g. a refund the owner approves), state the contract you need and flag it as a blocker in `.agents/active.md` rather than guessing.
5. End of session → write a checkpoint at `.agents/sessions/YYYY-MM-DD-HHMM-app-<slug>.md`.

## Verify before done
- `cd backend && php artisan test`
- `cd frontend && npx tsc --noEmit && npx vitest run`
Tests must stay green (baseline: backend 87/87, tsc clean, 22/22 vitest).

## Run
- backend: `cd backend && php artisan serve` (:8000)
- frontend: `cd frontend && npm run dev` → `/` (customer)

## Current known priority
LINE LIFF login is still **mocked** (`frontend/lib/auth/auth-context.tsx` hardcodes a user; `AuthController::lineLogin` has a verify TODO). This is the biggest blocker to real customer use — likely your top task."""

name: Deploy to Production

# Pull-model deploy: the runner just SSHes into the server, pulls main, and
# (re)builds only the side that changed. The server holds a git clone of the
# repo at DEPLOY_PATH (monorepo: backend/ + frontend/) and has PHP 8.4, Node,
# and Composer installed. The Next.js frontend is built in place and served
# from .next/standalone/server.js by the `sanamspace-frontend` systemd unit.
#
# Incremental: a push touching backend/** runs composer+migrate; touching
# frontend/** rebuilds Next; touching neither (docs, workflow) does nothing.
# A manual run (workflow_dispatch) rebuilds both.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   SERVER_HOST  SERVER_USER  SERVER_PASSWORD  DEPLOY_PATH
# Optional:
#   SERVER_PORT          SSH port (default 22)
#   NEXT_PUBLIC_API_URL  build-time API base (default /api/v1, same-origin)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (pull, build, migrate, restart)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e
            APP="${{ secrets.DEPLOY_PATH }}"
            EVENT="${{ github.event_name }}"
            API_URL="${{ secrets.NEXT_PUBLIC_API_URL || '/api/v1' }}"
            SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo"

            # ---------- pull latest, work out what changed ----------
            cd "$APP"
            git fetch origin main
            BEFORE="$(git rev-parse HEAD)"
            git reset --hard origin/main
            AFTER="$(git rev-parse HEAD)"

            FE=false; BE=false
            if [ "$EVENT" = "workflow_dispatch" ]; then
              FE=true; BE=true                      # manual run = rebuild everything
            elif [ "$BEFORE" = "$AFTER" ]; then
              echo "Already at $AFTER — nothing to pull."
            else
              CHANGED="$(git diff --name-only "$BEFORE" "$AFTER")"
              echo "$CHANGED" | sed 's/^/changed: /'
              echo "$CHANGED" | grep -q '^backend/'  && BE=true || true
              echo "$CHANGED" | grep -q '^frontend/' && FE=true || true
            fi
            echo "Build plan -> frontend=$FE backend=$BE"

            # ---------- backend: deps, migrate, cache, reload ----------
            if [ "$BE" = "true" ]; then
              cd "$APP/backend"
              PHP="$(command -v php8.4 || command -v php)"
              [ -f .env ] || { echo "ERROR: $APP/backend/.env is missing."; exit 1; }
              composer install --no-dev --optimize-autoloader --no-interaction
              "$PHP" artisan migrate --force
              "$PHP" artisan storage:link 2>/dev/null || true
              "$PHP" artisan config:cache
              "$PHP" artisan route:cache
              "$PHP" artisan view:cache
              $SUDO chown -R www-data:www-data "$APP/backend/storage" "$APP/backend/bootstrap/cache" 2>/dev/null || true
              $SUDO systemctl restart sanamspace-queue 2>/dev/null || true
              $SUDO systemctl reload php8.4-fpm 2>/dev/null || $SUDO systemctl reload php-fpm 2>/dev/null || true
            fi

            # ---------- frontend: build standalone, restart Next ----------
            if [ "$FE" = "true" ]; then
              cd "$APP/frontend"
              export NEXT_PUBLIC_API_URL="$API_URL"
              npm ci
              npm run build
              # the standalone bundle ships server.js + node_modules but NOT the
              # static assets / public files — copy them in so the server can serve them.
              cp -r .next/static .next/standalone/.next/static
              [ -d public ] && cp -r public .next/standalone/public || true
              $SUDO chown -R www-data:www-data "$APP/frontend" 2>/dev/null || true
              $SUDO systemctl restart sanamspace-frontend 2>/dev/null || true
            fi

            echo "Deploy done (frontend=$FE backend=$BE) @ $(date)"

name: Deploy to Production

# Builds SanamSpace on the runner and ships it to the server with rsync over SSH
# (delta transfer — only changed files move, so re-deploys are fast). The server
# only runs migrations + restarts the Node service; no build step on the server.
#
# Incremental: only the side that actually changed is built & shipped.
#   - push that touches frontend/** -> build + sync frontend, restart Next
#   - push that touches backend/**  -> install + sync backend, migrate, reload PHP
#   - a change to this workflow (or a manual run) -> deploy both, to be safe
#   - a push that touches neither (docs, root files) -> nothing is deployed
#
# Every deploy waits on ci.yml (backend on MySQL, frontend, e2e). A red suite
# stops the ship.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   SERVER_HOST  SERVER_USER  SERVER_PASSWORD  DEPLOY_PATH
# Optional:
#   SERVER_PORT          SSH port (default 22)
#   NEXT_PUBLIC_API_URL  build-time API base (default /api/v1, same-origin)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Nothing ships until the suite is green. Before this the two were unrelated:
  # a push went to production whether or not the tests would have passed, and
  # nothing ran them to find out.
  test:
    uses: ./.github/workflows/ci.yml

  # Is a server actually configured?
  #
  # Without this the deploy job ran regardless and rsync fired at
  # "user@host:/frontend/" with empty secrets, so EVERY push to main finished
  # red whether the suite passed or not. A red X that is always there is not a
  # signal — a genuinely broken e2e spec sat unnoticed for two days underneath
  # one. Unconfigured now SKIPS, so red means the tests failed.
  configured:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER_: ${{ secrets.SERVER_USER }}
          PATH_: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -n "$HOST" ] && [ -n "$USER_" ] && [ -n "$PATH_" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped — SERVER_HOST / SERVER_USER / DEPLOY_PATH are not all set."
          fi

  deploy:
    needs: [ test, configured ]
    if: needs.configured.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- decide which side(s) changed ----------
      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            workflow:
              - '.github/workflows/deploy.yml'
      - name: Decide what to deploy
        id: decide
        run: |
          FE=false; BE=false
          # a workflow change or a manual run deploys both (build config may differ)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.changes.outputs.workflow }}" = "true" ]; then
            FE=true; BE=true
          fi
          [ "${{ steps.changes.outputs.frontend }}" = "true" ] && FE=true
          [ "${{ steps.changes.outputs.backend }}" = "true" ] && BE=true
          echo "fe=$FE" >> "$GITHUB_OUTPUT"
          echo "be=$BE" >> "$GITHUB_OUTPUT"
          echo "Deploy -> frontend=$FE  backend=$BE"

      # ---------- frontend: Next.js standalone build (on the runner) ----------
      - if: steps.decide.outputs.fe == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Cache Next build
        if: steps.decide.outputs.fe == 'true'
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ hashFiles('frontend/package-lock.json') }}-
            nextjs-
      - name: Build frontend (standalone)
        if: steps.decide.outputs.fe == 'true'
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || '/api/v1' }}
        run: |
          npm ci
          npm run build
          # assemble a self-contained run dir: server.js + bundled node_modules + static + public
          mkdir -p ../_stage/frontend
          cp -r .next/standalone/. ../_stage/frontend/
          mkdir -p ../_stage/frontend/.next
          cp -r .next/static ../_stage/frontend/.next/static
          [ -d public ] && cp -r public ../_stage/frontend/public || true

      # ---------- backend: Laravel deps (on the runner) ----------
      - if: steps.decide.outputs.be == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'   # Laravel 13 requires php ^8.3
          extensions: mbstring, xml, curl, zip, bcmath, intl, pdo_mysql
          coverage: none
      - name: Cache composer vendor
        if: steps.decide.outputs.be == 'true'
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-
      - name: Install backend deps
        if: steps.decide.outputs.be == 'true'
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction
      - name: Stage backend
        if: steps.decide.outputs.be == 'true'
        run: |
          mkdir -p _stage/backend
          rsync -a --exclude '.env' --exclude 'storage' --exclude '.git' \
                   --exclude 'tests' --exclude 'node_modules' \
                   backend/ _stage/backend/

      # ---------- ship + post-deploy over SSH (rsync delta, password auth) ----------
      - name: Install sshpass
        if: steps.decide.outputs.fe == 'true' || steps.decide.outputs.be == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Sync frontend to server (rsync)
        if: steps.decide.outputs.fe == 'true'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          sshpass -p "$SERVER_PASSWORD" rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p $SERVER_PORT" \
            _stage/frontend/ "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/frontend/"

      - name: Sync backend to server (rsync)
        if: steps.decide.outputs.be == 'true'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # --delete keeps the server clean but never touches the server's .env or storage/
          sshpass -p "$SERVER_PASSWORD" rsync -az --delete --exclude '.env' --exclude 'storage' \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p $SERVER_PORT" \
            _stage/backend/ "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/backend/"

      - name: Post-deploy (migrate + restart)
        if: steps.decide.outputs.fe == 'true' || steps.decide.outputs.be == 'true'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          FE: ${{ steps.decide.outputs.fe }}
          BE: ${{ steps.decide.outputs.be }}
        run: |
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "bash -s '$DEPLOY_PATH' '$FE' '$BE'" <<'EOF'
          set -e
          APP="$1"; FE="$2"; BE="$3"
          SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo"
          if [ "$BE" = "true" ]; then
            cd "$APP/backend"
            PHP="$(command -v php8.4 || command -v php)"
            if [ ! -f .env ]; then echo "ERROR: $APP/backend/.env is missing."; exit 1; fi
            "$PHP" artisan migrate --force
            "$PHP" artisan storage:link 2>/dev/null || true
            "$PHP" artisan config:cache
            "$PHP" artisan route:cache
            "$PHP" artisan view:cache
            $SUDO chown -R www-data:www-data "$APP/backend/storage" "$APP/backend/bootstrap/cache" 2>/dev/null || true
            $SUDO systemctl restart sanamspace-queue 2>/dev/null || true
            $SUDO systemctl reload php8.4-fpm 2>/dev/null || $SUDO systemctl reload php-fpm 2>/dev/null || true
          fi
          if [ "$FE" = "true" ]; then
            $SUDO chown -R www-data:www-data "$APP/frontend" 2>/dev/null || true
            $SUDO systemctl restart sanamspace-frontend 2>/dev/null || true
          fi
          echo "Post-deploy done (frontend=$FE backend=$BE)"
          EOF

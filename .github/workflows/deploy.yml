name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, curl, zip
        coverage: none
    
    - name: Sync Files to Server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        # ระบุไฟล์และโฟลเดอร์ที่ต้องการส่งไปตรงๆ
        source: "api,public,src,database,uploads,index2.html,.env.example"
        # ปลายทางคือชื่อโปรเจกต์ของคุณ
        target: "/var/www/html/sanamspace"

    - name: Post Deployment Script
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # เข้าไปยังโฟลเดอร์โปรเจกต์
          cd /var/www/html/sanamspace
          
          # จัดการไฟล์ .htaccess (ก๊อปปี้จาก api มาไว้ที่ root ของโปรเจกต์)
          if [ -f "api/.htaccess" ]; then
            cp api/.htaccess .
          fi
          
          # ปรับ Permission ให้เป็นของ Web Server (www-data)
          sudo chown -R www-data:www-data /var/www/html/sanamspace
          sudo chmod -R 755 /var/www/html/sanamspace
# SanamSpace edge — API (php-fpm) + Next.js (proxy), single origin.
server {
    listen 80;
    server_name _;
    client_max_body_size 12m;   # room for slip uploads

    # --- Laravel API / health / sanctum → php-fpm (backend:9000) ---
    location ~ ^/(api|up|sanctum) {
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        include fastcgi_params;
    }

    # --- Uploaded slips on local disk (dev/simple prod). With R2/S3, slips are
    #     absolute URLs and this block is unused. ---
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 7d;
    }

    # --- Everything else → Next.js (customer / owner / admin) ---
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

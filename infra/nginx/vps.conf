# SanamSpace edge for a bare Ubuntu VPS (Nginx + PHP-FPM + local Next).
# Place at /etc/nginx/sites-available/sanamspace and symlink to sites-enabled.
# Then add TLS with: certbot --nginx -d example.com
server {
    listen 80;
    server_name example.com;
    root /var/www/sanamspace/backend/public;
    index index.php;
    client_max_body_size 12m;

    # Laravel API / health / sanctum → front controller
    location ~ ^/(api|up|sanctum) {
        try_files $uri /index.php?$query_string;
    }

    # PHP-FPM (adjust socket to your PHP version)
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Uploaded slips (local disk) via public/storage symlink under root
    location /storage/ {
        expires 7d;
        access_log off;
    }

    # Everything else → Next.js (running on 127.0.0.1:3000 via systemd)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

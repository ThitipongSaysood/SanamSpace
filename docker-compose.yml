# SanamSpace — full stack for production-parity deploy.
# Edge nginx serves /api,/up,/sanctum via php-fpm (backend) and proxies the
# rest to the Next.js app (frontend). Single entrypoint on :80 (same-origin).
#
# Setup:
#   cp backend/.env.production.example backend/.env   # set DB_HOST=db + a strong password
#   cp .env.deploy.example .env                        # DB creds for the db service (optional)
#   docker compose build && docker compose up -d
#   docker compose exec backend php artisan key:generate
#   docker compose exec backend php artisan db:seed --force   # optional demo data

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sanamspace}
      MYSQL_USER: ${DB_USERNAME:-sanamspace}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-change-me-root}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_storage:/var/www/html/storage
    expose:
      - "9000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - frontend
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_storage:/var/www/html/storage:ro
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  dbdata:
  backend_storage:
